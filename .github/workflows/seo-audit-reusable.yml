name: Reusable SEO audit

on:
  workflow_call:
    inputs:
      config-path:
        description: Path to the caller repository's SEO configuration file
        required: false
        default: seo.config.json
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: Validate website SEO surface
    runs-on: ubuntu-latest
    steps:
      - name: Check out caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out shared SEO engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: karefined-eng/website-seo-automation
          ref: e722a76b3f9c4e498c1a7c7839b1b235d50e716d # main
          path: .seo-engine

      - name: Run SEO checks
        run: python3 .seo-engine/scripts/seo_check.py --config "${{ inputs.config-path }}"
